<section id="s20">
    <h2>The core equation, wired up</h2>
    <p>Hover over (or tap) any symbol in the equation. The picture highlights what that symbol is, and the line below the picture fills the equation in with the current numbers. Change the sliders or drag the weights and watch the numbers follow.</p>
    <div id="eq" class="eqbox"></div>
    <p id="eq-cap" class="note"></p>
    <svg id="eqv" viewBox="0 0 800 330"></svg>
    <label class="ctl" id="eq-t-l">t (the clock) <input id="eq-t" type="range" min="0" max="1" step="0.005" value="0.62"> <b id="eq-tv">0.62</b></label>
    <label class="ctl" id="eq-p-l">degree p <input id="eq-p" type="range" min="0" max="3" step="1" value="3"> <b id="eq-pv">3</b></label>
    <button class="alt" id="eq-reset">reset weights</button>
    <p id="eq-sub" class="readout"></p>
  </section>
